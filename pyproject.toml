[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orchlet"
version = "0.1.0"
description = "Composable, event-driven orchestration for dynamic Python and agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "rich>=13.9,<16"]

[project.optional-dependencies]
dev = ["ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchlet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
