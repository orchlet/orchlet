[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orchlet"
version = "0.1.0"
description = "Composable, event-driven orchestration for dynamic Python and agent workflows"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.10,<3", "rich>=13.9,<16", "typing-extensions>=4.13,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.12", "pyright>=1.1.414"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchlet"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "examples", "tests", "typecheck"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
# Some Pylance releases still gate PEP 747 (TypeForm) behind this setting.
enableExperimentalFeatures = true
