default_language_version:
  python: python3.14
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: ruff format .
        language: python
        additional_dependencies: [ruff==0.16.8]
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: Ruff check
        entry: ruff check .
        language: python
        additional_dependencies: [ruff==0.16.8]
        pass_filenames: false
        always_run: true

      - id: pyright
        name: Pyright strict (no warnings)
        entry: pyright --warnings
        language: python
        additional_dependencies:
          - pyright==1.1.414
          # Keep analysis dependencies aligned with pyproject.toml.
          - pydantic>=2.10,<3
          - rich>=13.9,<16
          - typing-extensions>=4.13,<5
        pass_filenames: false
        always_run: true
